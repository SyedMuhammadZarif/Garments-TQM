# SPEC §22.4. Serves the SPA and proxies the API on the same origin (no CORS in production).

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types application/json application/javascript text/css image/svg+xml application/manifest+json;

upstream tqm_api {
  server api:4000;
  keepalive 32;
}

server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  client_max_body_size 25m;
  server_tokens off;

  set $csp "default-src 'self'; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; script-src 'self'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'";

  # Server-Sent Events: never buffer, keep the connection open.
  location ~ ^/api/v1/(stream|display/stream)$ {
    proxy_pass http://tqm_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_cache off;
    proxy_read_timeout 1h;
    gzip off;
  }

  location /api/ {
    proxy_pass http://tqm_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Photos/files: the API checks permission, then answers with X-Accel-Redirect to this internal location.
  location /_protected/uploads/ {
    internal;
    alias /data/uploads/;
    add_header Cache-Control "private, max-age=86400" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # Hashed build assets never change.
  location /assets/ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options nosniff always;
  }

  # SPA: every other path serves index.html, which must never be cached.
  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache" always;
    add_header Content-Security-Policy $csp always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(self), geolocation=()" always;
  }
}
